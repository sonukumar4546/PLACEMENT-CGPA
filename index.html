
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CGPA → Package Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #070707;
      --white:     #ffffff;
      --gray:      #333333;
      --lightgray: #bdbdbd;
      --blue:      #007bff;
      --red:       #dc3545;
      --green:     #28a745;

      --font-a: 'Syne', sans-serif;
      --font-b: 'DM Mono', monospace;

      --base-font-size: 16px;
      --heading-line-height: 1.2;
      --body-line-height: 1.6;
    }

    body {
      font-family: var(--font-b);
      font-size: var(--base-font-size);
      line-height: var(--body-line-height);
      color: var(--white);
      background-color: var(--bg);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--gray);
      padding: 40px 30px;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
      max-width: 450px;
    }

    h1 {
      font-family: var(--font-a);
      font-size: 2.5rem;
      color: var(--blue);
      margin-bottom: 20px;
      line-height: var(--heading-line-height);
    }

    p {
      font-size: 1rem;
      margin-bottom: 25px;
      color: var(--lightgray);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 25px;
    }

    input[type="number"] {
      padding: 12px 15px;
      border: 1px solid #555;
      border-radius: 5px;
      background-color: #222;
      color: var(--white);
      font-size: 1rem;
      text-align: center;
      transition: border-color 0.3s ease;
    }

    input[type="number"]::placeholder {
      color: #888;
    }

    input[type="number"]:focus {
      border-color: var(--blue);
      outline: none;
    }

    button {
      background-color: var(--green);
      color: var(--white);
      border: none;
      border-radius: 5px;
      padding: 12px 20px;
      font-size: 1.1rem;
      font-family: var(--font-a);
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    button:hover {
      background-color: #218838;
      transform: translateY(-2px);
    }

    .prediction-result {
      font-size: 1.4rem;
      font-family: var(--font-a);
      color: var(--blue);
      background-color: #2c2c2c;
      padding: 15px;
      border-radius: 8px;
      margin-top: 20px;
      word-wrap: break-word;
    }

    .prediction-result.error {
      color: var(--red);
      border: 2px solid var(--red);
    }

    .error-message {
      color: var(--red);
      font-size: 1rem;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>CGPA → Package Predictor</h1>
    <p>Enter a CGPA value to predict the corresponding package (LPA).</p>
    <form action="/predict" method="post">
      <input type="number" step="0.01" name="cgpa" placeholder="Enter CGPA (e.g., 8.5)" required />
      <button type="submit">Predict Package</button>
    </form>
    {% if prediction_text %}
      <div class="prediction-result {% if 'Invalid CGPA' in prediction_text or 'An error occurred' in prediction_text %}error{% endif %}">{{ prediction_text }}</div>
    {% endif %}
    {% if error_message %}
      <div class="error-message">{{ error_message }}</div>
    {% endif %}
  </div>
</body>
</html>
